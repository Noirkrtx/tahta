<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tahta</title>
    <meta name="description" content="Ask a question and watch the answer get written and drawn on a board, step by step." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23faf7ef'/%3E%3Cpath d='M7 10h18M16 10v14' stroke='%2323262d' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M7 15h18' stroke='%23c9352b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">tahta</span>
        <span class="tagline" data-i18n="tagline"></span>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-lang" class="ghost" aria-label="Language / Dil"></button>
        <button type="button" id="btn-settings" class="ghost" data-i18n="settings"></button>
        <a class="ghost" href="https://github.com/Noirkrtx/tahta" rel="noopener">GitHub</a>
      </div>
    </header>

    <main>
      <form id="ask" class="ask" autocomplete="off">
        <input id="question" type="text" maxlength="400" data-i18n-placeholder="questionPlaceholder" />
        <button type="submit" id="btn-ask" class="primary" data-i18n="ask"></button>
      </form>
      <div class="demos">
        <span data-i18n="demos"></span>
        <span id="demo-list" class="chips"></span>
      </div>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <div class="stage">
        <section class="board-col">
          <div id="board" class="board"></div>
          <div id="narration" class="narration" aria-live="polite"></div>
          <div class="controls">
            <button type="button" id="btn-restart" data-i18n-title="restart">↺</button>
            <button type="button" id="btn-prev" data-i18n-title="prev">‹</button>
            <button type="button" id="btn-play" class="primary play"></button>
            <button type="button" id="btn-next" data-i18n-title="next">›</button>
            <input id="progress" type="range" min="0" max="1000" value="0" data-i18n-title="progress" />
            <span id="step-count" class="step-count"></span>
            <label class="speed"
              ><span data-i18n="speed"></span>
              <select id="speed"></select>
            </label>
          </div>
          <div class="exports">
            <span data-i18n="exportLabel"></span>
            <button type="button" id="btn-json" class="ghost" data-i18n="downloadJson"></button>
            <button type="button" id="btn-svg" class="ghost" data-i18n="downloadSvg"></button>
            <button type="button" id="btn-png" class="ghost" data-i18n="downloadPng"></button>
            <button type="button" id="btn-load" class="ghost" data-i18n="loadJson"></button>
            <input id="file" type="file" accept="application/json,.json" hidden />
            <span class="hint" data-i18n="keyboardHint"></span>
          </div>
        </section>
        <aside class="steps-col">
          <h2 data-i18n="steps"></h2>
          <ol id="step-list" class="step-list"></ol>
        </aside>
      </div>
    </main>

    <footer><span data-i18n="footer"></span></footer>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2 data-i18n="settingsTitle"></h2>
        <label for="api-key" data-i18n="apiKeyLabel"></label>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" />
        <p class="warning" data-i18n="apiKeyWarning"></p>
        <label for="model" data-i18n="modelLabel"></label>
        <input id="model" type="text" autocomplete="off" spellcheck="false" />
        <p class="note" data-i18n="modelNote"></p>
        <p id="settings-msg" class="note" role="status"></p>
        <div class="dialog-actions">
          <button type="button" id="btn-remove-key" class="ghost danger" data-i18n="removeKey"></button>
          <span class="spacer"></span>
          <button type="button" id="btn-close" class="ghost" data-i18n="close"></button>
          <button type="button" id="btn-save" class="primary" data-i18n="save"></button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
